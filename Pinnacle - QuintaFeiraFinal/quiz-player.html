<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Pinnacle Quiz Player</title>

    <!-- CSS -->

    <link rel="stylesheet" href="quiz-player.css" />

    <!-- FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ICONS -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <!-- ========================================
         TOPBAR
    ======================================== -->

    <header class="topbar">
      <div class="logo">
        <a href="homepage.html">
          <img
            src="images/Pinnacle - Logo.png"
            alt="Pinnacle Logo"
          />
        </a>
      </div>

      <!-- USER MENU -->

      <div class="user-menu">
        <span class="account-type">
          Tipo de conta:
          <strong>Aluno</strong>
        </span>

        <button id="user-button" class="user-button">
          <i class="bi bi-person-fill"></i>
        </button>

        <div id="user-dropdown" class="user-dropdown">
          <a href="homepage.html">
            <i class="bi bi-box-arrow-right"></i>

            Logout
          </a>
        </div>
      </div>
    </header>

    <!-- ========================================
         MAIN
    ======================================== -->

    <main class="main">
      <!-- HEADER -->

      <section class="quiz-header">
        <div class="quiz-info">
          <h1 id="quiz-title">Carregando Quiz...</h1>

          <span id="question-counter">
            Pergunta 1 de 1
          </span>
        </div>

        <!-- SCORE -->

        <div class="score-box">
          <i class="bi bi-trophy-fill"></i>

          <span id="player-score">0 pts</span>
        </div>

        <!-- TIMER -->

        <div class="timer-circle" id="timer-circle">
          <span id="timer">20</span>
        </div>
      </section>

      <!-- QUESTION -->

      <section class="question-section">
        <h2 class="question-title" id="question-title">
          Pergunta
        </h2>

        <!-- IMAGE -->

        <div
          class="question-image hidden"
          id="question-image-container"
        >
          <img
            id="question-image"
            alt="Imagem da pergunta"
          />
        </div>

        <!-- ANSWERS -->

        <div class="answers-grid">
          <!-- RED -->

          <button
            class="answer-btn answer-red"
            data-index="0"
          >
            <div class="answer-bar red"></div>

            <div class="answer-content">
              <span class="answer-letter">A</span>

              <span class="answer-text"></span>
            </div>
          </button>

          <!-- BLUE -->

          <button
            class="answer-btn answer-blue"
            data-index="1"
          >
            <div class="answer-bar blue"></div>

            <div class="answer-content">
              <span class="answer-letter">B</span>

              <span class="answer-text"></span>
            </div>
          </button>

          <!-- YELLOW -->

          <button
            class="answer-btn answer-yellow"
            data-index="2"
          >
            <div class="answer-bar yellow"></div>

            <div class="answer-content">
              <span class="answer-letter">C</span>

              <span class="answer-text"></span>
            </div>
          </button>

          <!-- GREEN -->

          <button
            class="answer-btn answer-green"
            data-index="3"
          >
            <div class="answer-bar green"></div>

            <div class="answer-content">
              <span class="answer-letter">D</span>

              <span class="answer-text"></span>
            </div>
          </button>
        </div>
      </section>

      <!-- FEEDBACK -->

      <section
        class="feedback-modal hidden"
        id="feedback-modal"
      >
        <div class="feedback-content">
          <div id="feedback-icon" class="feedback-icon">
            <i class="bi bi-check-circle-fill"></i>
          </div>

          <h2 id="feedback-title">
            Resposta Correta!
          </h2>

          <p id="feedback-points">
            +100 pontos
          </p>

          <button id="next-question-btn">
            Próxima Pergunta
          </button>
        </div>
      </section>

      <!-- RANKING -->

      <section
        class="ranking-screen hidden"
        id="ranking-screen"
      >
        <h1>Ranking Final</h1>

        <div
          class="ranking-podium"
          id="ranking-podium"
        ></div>

        <button
          class="play-again-btn"
          onclick="location.reload()"
        >
          Jogar Novamente
        </button>
      </section>
    </main>

    <!-- ========================================
         FOOTER
    ======================================== -->

    <footer class="footer">
      <span>Pinnacle™</span>
    </footer>

    <!-- JS -->

    <script src="quiz-player.js"></script>
  </body>
</html>
